; PlatformIO: сборка скетча из папки ESP32_L293D_Axis
; (в Arduino IDE достаточно открыть ESP32_L293D_Axis/ESP32_L293D_Axis.ino)

[platformio]
src_dir = ESP32_L293D_Axis
; линкер ESP32 не открывает firmware.map по пути с кириллицей ("Учёба/ПОМиРС/...") —
; собираем в каталог PlatformIO, путь к которому без кириллицы
build_dir = ${platformio.core_dir}/.build/AxisMacket

[env:esp32dev]
; платформа pioarduino с GitHub (ядро Arduino-ESP32 3.x) — в обход реестра PlatformIO
; версия закреплена: 55.03.312 требует ядро >=6.2.0 и не принимает pioarduino 6.2.0.post1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
